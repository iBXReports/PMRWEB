<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPMR - Login de Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --accent: #3b82f6;
            --glass: rgba(30, 41, 59, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1e293b, #020617);
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-box {
            font-size: 3rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            opacity: 0.6;
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-family: inherit;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        button {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 15px;
            font-family: inherit;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
            background: #2563eb;
        }

        #error-msg {
            margin-top: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            display: none;
        }

        /* Abstract blobs */
        .blob {
            position: absolute;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.2;
        }
    </style>
</head>

<body>

    <div class="blob" style="width: 400px; height: 400px; background: var(--accent); top: -100px; right: -100px;"></div>
    <div class="blob" style="width: 300px; height: 300px; background: #8b5cf6; bottom: -50px; left: -50px;"></div>

    <div class="login-card">
        <div class="logo-box">♿</div>
        <h1>Bienvenido a WebPMR</h1>
        <p>Inicia sesión con tu RUT para ingresar al sistema de operaciones.</p>

        <form id="login-form">
            <div class="input-group">
                <label>RUT del Usuario</label>
                <input type="text" id="rut-input" placeholder="Ej: 12.345.678-9" required autofocus>
            </div>

            <button type="submit" id="btn-login">INGRESAR AL PANEL</button>
        </form>

        <div id="error-msg"></div>

        <div
            style="margin-top: 40px; font-size: 0.65rem; opacity: 0.3; text-transform: uppercase; font-weight: 900; letter-spacing: 2px;">
            Cargo Mobility - Operaciones SCL
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>

</html>
